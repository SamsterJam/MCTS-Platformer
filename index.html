<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCTS Platformer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div class="toolbar" id="toolbar">
        <div class="block-btn" style="background-color: blue;" data-type="player"></div>
        <div class="block-btn" style="background-color: green;" data-type="platform"></div>
        <div class="block-btn" style="background-color: red;" data-type="obstacle"></div>
        <div class="block-btn" style="background-color: gold;" data-type="goal"></div>
        <div class="block-btn" style="background-color: #fff; position: relative;" data-type="eraser"></div>
    </div>
    
    <div class="params-panel" id="paramsPanel">
        <h3>MCTS Parameters</h3>
        <div class="param-row">
            <label for="simCount">Simulations:</label>
            <input type="number" id="simCount" min="100" max="10000" value="1000">
        </div>
        <div class="param-row">
            <label for="maxDepth">Max Depth:</label>
            <input type="number" id="maxDepth" min="5" max="50" value="10">
        </div>
        <div class="param-row">
            <label for="exploreRate">Exploration Rate:</label>
            <input type="number" id="exploreRate" min="1" max="1000" value="100">
        </div>
        <div class="param-row">
            <label for="discountFactor">Discount Factor:</label>
            <input type="number" id="discountFactor" min="0" max="1" value="0.95">
        </div>
    </div>
    
    <div id="nodeCounter">
        Nodes: 0
    </div>
    <div class="sl-btn" id="saveBtn" style="bottom: 10px; right: 10px">SAVE</div>
    <div class="sl-btn" id="loadBtn" style="bottom: 10px; right: 100px">LOAD</div>
    <div class="play-btn" id="playBtn">PLAY</div>
    
    <script>
        const canvas = document.getElementById("gameCanvas");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        window.addEventListener('resize', resizeCanvas);
    </script>
    <script src="script.js"></script>
</body>
</html>
